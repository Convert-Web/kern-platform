async function refreshNotifDot(){
  if(!document.getElementById('notifDot') || !State.currentUser) return;
  const list = await DB.get('notif:'+State.currentUser.id) || [];
  const dot = document.getElementById('notifDot');
  if(!dot) return;
  const unread = list.some(n => !n.read);
  dot.hidden = !unread;
}

const NOTIF_VERBS = {
  like: 'a réagi à ta publication',
  comment: 'a commenté ta publication',
  follow: 'a commencé à te suivre',
  message: "t'a envoyé un message",
  mention: "t'a mentionné dans une publication",
  repost: 'a republié ta publication'
};

/* ======================================================================
   PAGE HASHTAG
====================================================================== */
async function renderHashtagPage(){
  const myGen = appGeneration;
  const tag = decodeURIComponent((location.hash.split('/')[1] || '').toLowerCase());
  const main = document.getElementById('mainCol');
  if(!main) return;
  main.innerHTML = `
    <div class="feed-header">
      <h1><span class="hashtag-title-icon">${iconHashtag}</span>${escapeHTML(tag)}</h1>
    </div>
    <div id="hashtagPostsList" class="posts-list">
      <div class="skeleton-post"></div>
    </div>
  `;
  const ids = await DB.get('hashtag:'+tag, true) || [];
  if(myGen !== appGeneration || !document.getElementById('hashtagPostsList')) return;
  const list = document.getElementById('hashtagPostsList');
  if(ids.length === 0){
    list.innerHTML = emptyStateHTML('hashtag', 'Aucune publication', `Personne n'a encore utilisé #${escapeHTML(tag)}.`, null, null);
    return;
  }
  const posts = (await Promise.all(ids.map(id=>DB.get('posts:'+id)))).filter(Boolean);
  if(myGen !== appGeneration || !document.getElementById('hashtagPostsList')) return;
  const visiblePosts = await filterVisiblePosts(posts);
  if(myGen !== appGeneration || !document.getElementById('hashtagPostsList')) return;
  if(visiblePosts.length === 0){
    list.innerHTML = emptyStateHTML('hashtag', 'Aucune publication visible', `Les publications utilisant #${escapeHTML(tag)} appartiennent à des comptes privés que tu ne suis pas.`, null, null);
    return;
  }
  list.innerHTML = '';
  for(const post of visiblePosts){
    list.appendChild(await renderPostCard(post));
  }
}

async function renderNotificationsPage(){
  const myGen = appGeneration;
  const main = document.getElementById('mainCol');
  if(!main) return;
  main.innerHTML = `<div class="feed-header"><h1>Notifications</h1></div><div id="notifList" class="posts-list"></div>`;

  const list = await DB.get('notif:'+State.currentUser.id) || [];
  if(myGen !== appGeneration) return;
  const listEl = document.getElementById('notifList');
  if(!listEl) return;

  if(list.length === 0){
    listEl.innerHTML = emptyStateHTML('bell', 'Aucune notification', 'Les likes, commentaires et nouveaux abonnés apparaîtront ici.', null, null);
  } else {
    const rows = [];
    for(const n of list){
      const fromUser = await getUser(n.fromId);
      rows.push(`
        <a href="${n.type==='message' ? '#messages' : n.type==='follow' ? '#profile/'+n.fromId : '#feed'}" class="notif-item ${n.read?'':'unread'}" data-id="${n.id}">
          ${avatarHTML(fromUser, 44)}
          <p><b>${escapeHTML(fromUser?.name || 'Quelqu\'un')}</b> ${escapeHTML(n.text || NOTIF_VERBS[n.type] || '')}</p>
          <span class="notif-time">${timeAgo(n.createdAt)}</span>
        </a>
      `);
    }
    if(myGen !== appGeneration || !document.getElementById('notifList')) return;
    listEl.innerHTML = rows.join('');
  }

  const unreadIds = list.filter(n=>!n.read).map(n=>n.id);
  if(unreadIds.length){
    list.forEach(n=>n.read = true);
    await DB.set('notif:'+State.currentUser.id, list);
    if(myGen === appGeneration) refreshNotifDot();
  }
}
/* ======================================================================
   LIVE (salle + chat en direct — sans broadcast vidéo réel, annoncé clairement)
   lives:index (shared) -> [liveId,...]
   lives:<id>            -> {id, hostId, title, startedAt, endedAt|null}
   lives:<id>:chat        -> [{id, authorId, text, createdAt}]
====================================================================== */
async function getOpenLives(){
  const index = await DB.get('lives:index', true) || [];
  const all = (await Promise.all(index.map(id=>DB.get('lives:'+id)))).filter(Boolean);
  return all.filter(l => !l.endedAt).sort((a,b)=>b.startedAt-a.startedAt);
}

async function startLive(title){
  const id = uid('lv');
  const live = {id, hostId: State.currentUser.id, title: title || 'Live sans titre', startedAt: Date.now(), endedAt: null};
  await DB.set('lives:'+id, live);
  await DB.set('lives:'+id+':chat', []);
  const index = await DB.get('lives:index', true) || [];
  index.unshift(id);
  await DB.set('lives:index', index, true);
  return live;
}

async function endLive(liveId){
  const live = await DB.get('lives:'+liveId);
  if(!live) return;
  live.endedAt = Date.now();
  await DB.set('lives:'+liveId, live);
}

async function renderLivePage(){
  stopPolling();
  const myGen = appGeneration;
  const main = document.getElementById('mainCol');
  if(!main) return;
  main.innerHTML = `
    <div class="feed-header">
      <h1>Lives</h1>
    </div>
    <button class="quick-composer" id="startLiveBtn" style="margin-bottom:24px">
      <span class="live-dot-icon"></span>
      <span>Démarrer un live</span>
    </button>
    <div id="liveGrid" class="live-grid"></div>
  `;
  document.getElementById('startLiveBtn').addEventListener('click', openStartLiveModal);

  const lives = await getOpenLives();
  if(myGen !== appGeneration || !document.getElementById('liveGrid')) return;
  const grid = document.getElementById('liveGrid');
  if(lives.length === 0){
    grid.innerHTML = emptyStateHTML('live', 'Aucun live en cours', 'Lance ton propre live ou reviens plus tard pour en découvrir.', null, null);
    return;
  }
  const cards = [];
  for(const live of lives){
    const host = await getUser(live.hostId);
    cards.push(`
      <button class="live-card" data-live="${live.id}">
        <div class="live-card-thumb">
          <span class="live-badge"><span class="live-dot-icon"></span> EN DIRECT</span>
        </div>
        <div class="live-card-info">
          ${avatarHTML(host, 32)}
          <div class="conv-list-text">
            <b>${escapeHTML(live.title)}</b>
            <span>@${escapeHTML(host?.handle||'')}</span>
          </div>
        </div>
      </button>
    `);
  }
  if(myGen !== appGeneration || !document.getElementById('liveGrid')) return;
  grid.innerHTML = cards.join('');
  grid.querySelectorAll('.live-card').forEach(el=>{
    el.addEventListener('click', ()=>openLiveRoom(el.dataset.live));
  });
}

function openStartLiveModal(){
  openModal(`
    <div class="modal-header">
      <h3>Démarrer un live</h3>
      <button class="icon-btn" id="closeLiveStart" aria-label="Fermer">${iconX}</button>
    </div>
    <div class="composer-body">
      <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:16px">
        Nova ouvre une salle de live avec chat en direct entre spectateurs. La diffusion vidéo en temps réel n'est pas simulée ici : cette démonstration se concentre sur la salle et l'échange en direct.
      </p>
      <label class="field">
        <span>Titre du live</span>
        <input type="text" id="liveTitleInput" placeholder="De quoi va parler ton live ?" maxlength="60">
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-accent" id="confirmStartLive" style="margin-left:auto">Passer en direct</button>
    </div>
  `);
  document.getElementById('closeLiveStart').addEventListener('click', closeModal);
  document.getElementById('confirmStartLive').addEventListener('click', async ()=>{
    const title = document.getElementById('liveTitleInput').value.trim();
    const live = await startLive(title);
    closeModal();
    openLiveRoom(live.id, true);
  });
}

let liveRoomState = null;
async function openLiveRoom(liveId, isNewlyStarted=false){
  const live = await DB.get('lives:'+liveId);
  if(!live){ toast('Ce live est terminé.', 'danger'); return; }
  const host = await getUser(live.hostId);
  const isHost = live.hostId === State.currentUser.id;
  liveRoomState = {liveId, lastChatCount: 0};

  openModal(`
    <div class="live-room">
      <div class="live-room-stage">
        <div class="live-room-stage-inner">
          <span class="live-badge"><span class="live-dot-icon"></span> EN DIRECT</span>
          <div class="live-room-avatar">${avatarHTML(host, 84)}</div>
          <b>${escapeHTML(live.title)}</b>
          <span>@${escapeHTML(host?.handle||'')} anime ce live</span>
        </div>
        <button class="icon-btn story-close-btn" id="closeLiveRoom" aria-label="Fermer" style="position:absolute;top:14px;right:14px;color:#fff">${iconX}</button>
        ${isHost ? `<button class="btn-accent" id="endLiveBtn" style="position:absolute;bottom:14px;right:14px;background:var(--danger)">Terminer le live</button>` : ''}
      </div>
      <div class="live-room-chat">
        <div class="live-chat-messages" id="liveChatMessages"></div>
        <form class="thread-composer" id="liveChatForm">
          <input type="text" id="liveChatInput" placeholder="Envoyer un message…" maxlength="200" autocomplete="off">
          <button type="submit" class="icon-btn" aria-label="Envoyer">${iconSend}</button>
        </form>
      </div>
    </div>
  `, {wide:true});

  document.getElementById('closeLiveRoom').addEventListener('click', ()=>{ stopPolling(); closeModal(); });
  document.getElementById('endLiveBtn')?.addEventListener('click', async ()=>{
    await endLive(liveId);
    stopPolling();
    closeModal();
    toast('Live terminé.');
    if(State.route === '#live') renderLivePage();
  });
  document.getElementById('liveChatForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const input = document.getElementById('liveChatInput');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    const chat = await DB.get('lives:'+liveId+':chat') || [];
    chat.push({id:uid('lc'), authorId: State.currentUser.id, text, createdAt: Date.now()});
    await DB.set('lives:'+liveId+':chat', chat);
    await paintLiveChat(liveId);
  });

  await paintLiveChat(liveId);
  stopPolling();
  State.pollTimer = setInterval(async ()=>{
    if(!document.getElementById('liveChatMessages')) return;
    await paintLiveChat(liveId, true);
  }, 2500);
}

async function paintLiveChat(liveId, isPoll=false){
  const box = document.getElementById('liveChatMessages');
  if(!box) return;
  const chat = await DB.get('lives:'+liveId+':chat') || [];
  if(isPoll && liveRoomState && chat.length === liveRoomState.lastChatCount) return;
  if(liveRoomState) liveRoomState.lastChatCount = chat.length;
  if(chat.length === 0){
    box.innerHTML = `<p class="no-comments" style="text-align:center;padding:20px 0">Sois le premier à écrire dans le chat.</p>`;
    return;
  }
  const rows = [];
  for(const m of chat.slice(-60)){
    const u = await getUser(m.authorId);
    rows.push(`<div class="comment-item"><b style="font-size:13px;font-weight:700;margin-right:4px">${escapeHTML(u?.name||'')}</b><span style="font-size:13.5px">${escapeHTML(m.text)}</span></div>`);
  }
  box.innerHTML = rows.join('');
  box.scrollTop = box.scrollHeight;
}
