/** Organise les commentaires en arbre à UN seul niveau de profondeur : les
 *  racines (parentId null) dans l'ordre chronologique, chacune suivie de ses
 *  réponses directes également triées par date. Une réponse à une réponse
 *  s'attache toujours au commentaire racine d'origine (voir postComment,
 *  qui ne connaît qu'un parentId, jamais une chaîne de parents), jamais à
 *  la réponse elle-même — comme la plupart des plateformes, pour éviter un
 *  empilement de profondeur illisible sur mobile. */
function groupCommentsIntoThreads(comments){
  const roots = comments.filter(c => !c.parentId).sort((a,b)=>a.createdAt-b.createdAt);
  const repliesByParent = new Map();
  comments.filter(c => c.parentId).forEach(c=>{
    if(!repliesByParent.has(c.parentId)) repliesByParent.set(c.parentId, []);
    repliesByParent.get(c.parentId).push(c);
  });
  repliesByParent.forEach(list => list.sort((a,b)=>a.createdAt-b.createdAt));
  return roots.map(root => ({ root, replies: repliesByParent.get(root.id) || [] }));
}

function renderCommentBox(box, post){
  box.innerHTML = `
    <div class="comment-list">
      ${post.comments.length===0 ? '<p class="no-comments">Aucun commentaire. Sois le premier à réagir.</p>' : ''}
      <div class="comment-items" id="commentItems-${post.id}"></div>
    </div>
    <form class="comment-form" data-post="${post.id}">
      ${avatarHTML(State.currentUser, 30)}
      <input type="text" placeholder="Écrire un commentaire…" maxlength="240" required>
      <button type="submit" class="icon-btn" aria-label="Envoyer">${iconSend}</button>
    </form>
  `;
  const itemsRoot = box.querySelector('.comment-items');

  async function paintOneComment(c, isReply){
    const cu = await getUser(c.authorId);
    const cel = document.createElement('div');
    cel.className = isReply ? 'comment-item comment-reply' : 'comment-item';
    cel.dataset.commentId = c.id;
    cel.innerHTML = `
      ${avatarHTML(cu, isReply?24:30)}
      <div class="comment-body">
        <div class="comment-bubble"><b>${escapeHTML(cu?.name||'')}</b> ${richTextHTML(c.text)}</div>
        <div class="comment-meta">
          <span class="comment-time">${timeAgo(c.createdAt)}</span>
          ${!isReply ? `<button class="comment-reply-btn" data-reply-to="${c.id}" data-reply-name="${escapeHTML(cu?.name||'')}">Répondre</button>` : ''}
        </div>
      </div>`;
    return cel;
  }

  async function paintAll(){
    itemsRoot.innerHTML = '';
    const threads = groupCommentsIntoThreads(post.comments);
    for(const {root, replies} of threads){
      itemsRoot.appendChild(await paintOneComment(root, false));
      for(const reply of replies){
        itemsRoot.appendChild(await paintOneComment(reply, true));
      }
    }
    bindReplyButtons();
  }

  function bindReplyButtons(){
    itemsRoot.querySelectorAll('.comment-reply-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>openInlineReplyForm(btn.dataset.replyTo, btn.dataset.replyName));
    });
  }

  /** Affiche un mini-formulaire de réponse directement sous le commentaire
   *  ciblé, plutôt que de renvoyer le focus vers le formulaire principal en
   *  bas — sinon rien n'indique visuellement à qui la réponse s'adresse une
   *  fois le focus perdu du commentaire d'origine. Un seul formulaire de
   *  réponse inline actif à la fois : en ouvrir un nouveau ferme le précédent. */
  function openInlineReplyForm(parentId, parentAuthorName){
    itemsRoot.querySelectorAll('.inline-reply-form').forEach(f=>f.remove());
    const parentEl = itemsRoot.querySelector(`[data-comment-id="${parentId}"]`);
    if(!parentEl) return;
    const form = document.createElement('form');
    form.className = 'comment-form inline-reply-form';
    form.innerHTML = `
      ${avatarHTML(State.currentUser, 26)}
      <input type="text" placeholder="Répondre à ${escapeHTML(parentAuthorName)}…" maxlength="240" required>
      <button type="submit" class="icon-btn" aria-label="Envoyer">${iconSend}</button>
      <button type="button" class="icon-btn" aria-label="Annuler">${iconX}</button>
    `;
    // Insère juste après le commentaire racine (ou sa dernière réponse déjà visible),
    // jamais tout en bas de liste, pour que la position confirme visuellement le contexte.
    let insertAfter = parentEl;
    let next = parentEl.nextElementSibling;
    while(next && next.classList.contains('comment-reply') && next.dataset.commentId){
      const isReplyToSameParent = post.comments.find(c=>c.id===next.dataset.commentId)?.parentId === parentId;
      if(!isReplyToSameParent) break;
      insertAfter = next;
      next = next.nextElementSibling;
    }
    insertAfter.after(form);
    form.querySelector('input').focus();
    form.querySelector('[aria-label="Annuler"]').addEventListener('click', ()=>form.remove());
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const input = form.querySelector('input');
      const text = input.value.trim();
      if(!text) return;
      await postComment(text, parentId);
    });
  }

  async function postComment(text, parentId){
    const comment = {id:uid('c'), authorId: State.currentUser.id, text, createdAt: Date.now(), parentId: parentId || null};
    post.comments.push(comment);
    await DB.set('posts:'+post.id, post);
    itemsRoot.parentElement.querySelector('.no-comments')?.remove();
    await paintAll();
    const countEl = box.closest('.post-card')?.querySelector('[data-action="comment"] span:last-child');
    if(countEl) countEl.textContent = post.comments.length;
    // On notifie l'auteur du commentaire parent s'il y en a un (c'est lui qui
    // reçoit la réponse), et systématiquement l'auteur du post si ce n'est
    // pas la même personne et qu'il n'a pas déjà été notifié comme parent.
    const parentComment = parentId ? post.comments.find(c=>c.id===parentId) : null;
    const notifyTargets = new Set();
    if(parentComment && parentComment.authorId !== State.currentUser.id) notifyTargets.add(parentComment.authorId);
    if(post.authorId !== State.currentUser.id) notifyTargets.add(post.authorId);
    for(const targetId of notifyTargets){
      const body = parentComment && targetId === parentComment.authorId ? 'a répondu à ton commentaire' : 'a commenté ta publication';
      await pushNotification(targetId, 'comment', State.currentUser.id, body).catch(()=>{});
    }
  }

  paintAll();

  box.querySelector('.comment-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const input = e.target.querySelector('input');
    const text = input.value.trim();
    if(!text) return;
    input.value = '';
    await postComment(text, null);
  });
}

/* ======================================================================
   STORIES (création, anneau, visionneuse, expiration 24h)
====================================================================== */
async function createStory(imageDataUrl, text){
  const id = uid('st');
  const now = Date.now();
  const story = {
    id, authorId: State.currentUser.id,
    imageDataUrl, text: text || '',
    createdAt: now, expiresAt: now + 24*60*60*1000,
    viewedBy: []
  };
  // On écrit d'abord l'index (référence légère) : si ça échoue, rien n'est publié.
  // On écrit ensuite la story elle-même. Si CETTE écriture échoue, on retire
  // aussitôt la référence de l'index pour ne jamais laisser un fantôme visible
  // dans le fil sans contenu associé.
  const index = await DB.get('stories:index', true) || [];
  index.unshift(id);
  await DB.set('stories:index', index, true);
  try{
    await DB.set('stories:'+id, story);
  }catch(err){
    const rollback = (await DB.get('stories:index', true) || []).filter(sid => sid !== id);
    await DB.set('stories:index', rollback, true).catch(()=>{});
    throw err;
  }
  return story;
}

async function getActiveStories(){
  const index = await DB.get('stories:index', true) || [];
  const all = (await Promise.all(index.map(id=>DB.get('stories:'+id)))).filter(Boolean);
  const now = Date.now();
  return all.filter(s => s.expiresAt > now);
}

async function renderStoriesRow(){
  const myGen = appGeneration;
  const row = document.getElementById('storiesRow');
  if(!row) return;

  const active = await getActiveStories();
  if(myGen !== appGeneration || !document.getElementById('storiesRow')) return;
  const byAuthor = {};
  for(const s of active){
    if(!byAuthor[s.authorId]) byAuthor[s.authorId] = [];
    byAuthor[s.authorId].push(s);
  }
  const myStories = byAuthor[State.currentUser.id] || [];

  let html = `<div class="story-add" id="storyAddBtn">
    <div class="story-add-avatar ${myStories.length ? 'story-ring' : ''}">
      ${avatarHTML(State.currentUser, 56)}
      <span class="story-plus">${iconPlus}</span>
    </div>
    <span>Ta story</span>
  </div>`;

  const otherAuthorIds = Object.keys(byAuthor).filter(id => id !== State.currentUser.id);
  const authorEntries = [];
  for(const aid of otherAuthorIds){
    const u = await getUser(aid);
    if(u) authorEntries.push({user:u, stories:byAuthor[aid]});
  }
  for(const entry of authorEntries){
    const allViewed = entry.stories.every(s => s.viewedBy.includes(State.currentUser.id));
    html += `
    <div class="story-item" data-author="${entry.user.id}">
      <div class="story-item-avatar ${allViewed ? '' : 'story-ring'}">
        ${avatarHTML(entry.user, 56)}
      </div>
      <span>${escapeHTML(entry.user.name.split(' ')[0])}</span>
    </div>`;
  }

  row.innerHTML = html;
  document.getElementById('storyAddBtn').addEventListener('click', ()=>{
    if(myStories.length) openStoryViewer([{user:State.currentUser, stories:myStories}], 0);
    else openStoryComposer();
  });
  row.querySelectorAll('.story-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const aid = el.dataset.author;
      const idx = authorEntries.findIndex(e=>e.user.id===aid);
      openStoryViewer(authorEntries, idx);
    });
  });
}
/** Éditeur de story : deux façons d'obtenir une image (fichier existant, ou
 *  caméra live via getUserMedia), puis une couche d'édition commune (dessin
 *  à main levée + texte positionnable). Au moment de partager, tout est
 *  aplati sur un canvas unique en un seul dataURL — createStory() et le
 *  viewer de stories n'ont donc pas besoin de connaître ce nouveau format
 *  d'édition, ce qui évite de toucher à du code qui fonctionnait déjà. */
function openStoryComposer(){
  let cameraStream = null;
  // Nettoyage systématique de la caméra à la fermeture de la modale — voir
  // opts.onClose dans openModal, qui garantit l'appel quel que soit le chemin
  // de fermeture emprunté (bouton X, touche Échap, clic hors modale).
  function stopCamera(){
    if(cameraStream){
      cameraStream.getTracks().forEach(t=>t.stop());
      cameraStream = null;
    }
  }

  openModal(`
    <div class="modal-header">
      <h3>Nouvelle story</h3>
      <button class="icon-btn" id="closeStoryComposer" aria-label="Fermer">${iconX}</button>
    </div>
    <div class="composer-body">
      <div class="story-mode-tabs" id="storyModeTabs">
        <button class="story-mode-tab active" data-mode="file">${iconImage} Fichier</button>
        <button class="story-mode-tab" data-mode="camera">${iconCamera} Caméra</button>
      </div>

      <div id="storyFileMode">
        <div id="storyDropZone" class="story-drop-zone">
          ${iconImage}
          <p>Choisis une image pour ta story</p>
          <input type="file" accept="image/*" id="storyImageInput" hidden>
        </div>
      </div>

      <div id="storyCameraMode" hidden>
        <div class="story-editor-stage" id="storyCameraStage">
          <video id="storyCameraVideo" autoplay playsinline muted></video>
          <button class="icon-btn story-camera-switch" id="storyCameraSwitchBtn" aria-label="Changer de caméra" hidden>${iconCameraFlip}</button>
          <button class="story-camera-shutter" id="storyShutterBtn" aria-label="Prendre la photo"></button>
        </div>
      </div>

      <div id="storyEditWrap" hidden>
        <div class="story-editor-stage" id="storyEditStage">
          <img id="storyEditImg" alt="">
          <canvas class="story-editor-drawcanvas" id="storyDrawCanvas"></canvas>
          <div class="story-text-layer" id="storyTextLayer"></div>
        </div>
        <div class="story-toolbar">
          <button class="story-tool-btn" id="storyToolText" title="Ajouter du texte">${iconType}</button>
          <button class="story-tool-btn" id="storyToolDraw" title="Dessiner">${iconBrush}</button>
          <button class="story-tool-btn" id="storyToolErase" title="Gomme" hidden>${iconEraser}</button>
          <button class="story-tool-btn" id="storyToolUndo" title="Annuler le dernier trait">${iconUndo}</button>
          <div class="story-color-row" id="storyColorRow" hidden></div>
          <input type="range" class="story-brush-size" id="storyBrushSize" min="2" max="24" value="6" hidden>
        </div>
        <input type="text" id="storyCaption" class="story-caption-input" style="position:static;margin-top:10px;background:var(--bg);color:var(--ink);border:1.5px solid var(--border)" placeholder="Ajouter une légende…" maxlength="80">
        <button class="btn-ghost" id="storyRestartBtn" style="margin-top:10px;font-size:13px">${iconUndo} Recommencer avec une autre image</button>
      </div>

      <p class="composer-error" id="storyError" hidden></p>
    </div>
    <div class="modal-footer">
      <span style="font-size:12.5px;color:var(--ink-faint)">Visible 24 h</span>
      <button class="btn-accent" id="submitStory" style="margin-left:auto" disabled>Partager</button>
    </div>
  `, {onClose: stopCamera});

  const errorEl = document.getElementById('storyError');
  function showError(msg){ errorEl.textContent = msg; errorEl.hidden = false; }
  function clearError(){ errorEl.hidden = true; errorEl.textContent = ''; }

  let baseImageDataUrl = null; // image de fond choisie (fichier ou capture), avant édition
  let facingMode = 'user';

  document.getElementById('closeStoryComposer').addEventListener('click', closeModal);

  /* ---------- Mode : sélection de fichier (comportement existant) ---------- */
  const dropZone = document.getElementById('storyDropZone');
  const input = document.getElementById('storyImageInput');
  dropZone.addEventListener('click', ()=>input.click());
  input.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    clearError();
    if(!file.type.startsWith('image/')){ showError('Ce fichier n\'est pas une image.'); return; }
    if(file.size > 15*1024*1024){ showError('Image trop lourde (max 15 Mo avant compression).'); return; }
    // On ne touche qu'à un enfant temporaire, jamais à dropZone.innerHTML dans son
    // ensemble : remplacer tout le innerHTML détacherait l'input du DOM et son
    // futur clic (ex. après "Recommencer") ne déclencherait plus aucun événement.
    const spinner = document.createElement('div');
    spinner.innerHTML = `<div class="composer-spinner"></div><p>Traitement de l'image…</p>`;
    dropZone.prepend(spinner);
    dropZone.querySelector('svg')?.classList.add('hidden-during-processing');
    try{
      const dataUrl = await compressImage(file, {maxDim:1400, quality:0.85});
      spinner.remove();
      dropZone.querySelector('svg')?.classList.remove('hidden-during-processing');
      enterEditMode(dataUrl);
    }catch(err){
      spinner.remove();
      dropZone.querySelector('svg')?.classList.remove('hidden-during-processing');
      input.value = ''; // permet de resélectionner le même fichier après une erreur
      showError('Impossible de traiter cette image : ' + err.message);
    }
  });

  /* ---------- Mode : caméra live ---------- */
  const tabs = document.querySelectorAll('.story-mode-tab');
  const fileModeEl = document.getElementById('storyFileMode');
  const cameraModeEl = document.getElementById('storyCameraMode');
  const video = document.getElementById('storyCameraVideo');
  const cameraStage = document.getElementById('storyCameraStage');

  async function startCamera(){
    stopCamera();
    cameraStage.querySelector('.story-camera-error')?.remove();
    if(!navigator.mediaDevices?.getUserMedia){
      cameraStage.insertAdjacentHTML('beforeend', `<div class="story-camera-error">${iconCamera}<p>Ce navigateur ne permet pas d'accéder à la caméra depuis cette page. Utilise plutôt l'onglet Fichier.</p></div>`);
      return;
    }
    try{
      cameraStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode }, audio:false });
      video.srcObject = cameraStream;
      document.getElementById('storyCameraSwitchBtn').hidden = false;
    }catch(err){
      // Permission refusée, caméra absente, ou déjà utilisée ailleurs : dans tous
      // les cas on explique la cause probable plutôt que de laisser un écran noir muet.
      const reason = err.name === 'NotAllowedError'
        ? 'Accès à la caméra refusé. Autorise-le dans les réglages de ton navigateur pour ce site.'
        : err.name === 'NotFoundError'
        ? 'Aucune caméra détectée sur cet appareil.'
        : 'Impossible d\'accéder à la caméra. Utilise plutôt l\'onglet Fichier.';
      cameraStage.insertAdjacentHTML('beforeend', `<div class="story-camera-error">${iconCamera}<p>${escapeHTML(reason)}</p></div>`);
    }
  }

  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      tabs.forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const mode = tab.dataset.mode;
      fileModeEl.hidden = mode !== 'file';
      cameraModeEl.hidden = mode !== 'camera';
      if(mode === 'camera') startCamera();
      else stopCamera();
    });
  });

  document.getElementById('storyCameraSwitchBtn').addEventListener('click', ()=>{
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    startCamera();
  });

  document.getElementById('storyShutterBtn').addEventListener('click', ()=>{
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    // Effet miroir uniquement pour la caméra frontale, pour matcher ce que la
    // personne voit à l'écran (sinon le texte capturé en photo semble inversé).
    if(facingMode === 'user'){ ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0);
    stopCamera();
    enterEditMode(canvas.toDataURL('image/jpeg', 0.88));
  });

  /* ---------- Édition commune : dessin + texte, sur l'image obtenue ---------- */
  const editWrap = document.getElementById('storyEditWrap');
  const editStage = document.getElementById('storyEditStage');
  const editImg = document.getElementById('storyEditImg');
  const drawCanvas = document.getElementById('storyDrawCanvas');
  const drawCtx = drawCanvas.getContext('2d');
  const textLayer = document.getElementById('storyTextLayer');
  const submitBtn = document.getElementById('submitStory');

  const STORY_COLORS = ['#FFFFFF','#14161A','#3D5AFE','#FF6B4A','#16A34A','#E0393E','#E8A423'];
  let activeColor = STORY_COLORS[0];
  let brushSize = 6;
  let activeTool = null; // 'draw' | 'text' | null
  let strokes = []; // [{color,size,points:[{x,y}...]}] en coordonnées relatives 0..1, pour un rendu net à toute résolution
  let isDrawing = false;
  let textItems = []; // {id, text, x, y, color} en coordonnées relatives 0..1
  let selectedTextId = null;

  function enterEditMode(dataUrl){
    baseImageDataUrl = dataUrl;
    editImg.src = dataUrl;
    document.getElementById('storyModeTabs').hidden = true;
    fileModeEl.hidden = true; cameraModeEl.hidden = true; editWrap.hidden = false;
    submitBtn.disabled = false;
    clearError();
    requestAnimationFrame(resizeDrawCanvas);
  }

  function exitEditMode(){
    stopCamera();
    baseImageDataUrl = null;
    strokes = []; textItems = []; selectedTextId = null; activeTool = null;
    textLayer.innerHTML = ''; // sinon les anciens éléments de texte restent affichés par-dessus la prochaine image choisie
    editWrap.hidden = true;
    document.getElementById('storyModeTabs').hidden = false;
    submitBtn.disabled = true;
    // Revient à l'onglet Fichier par défaut plutôt qu'à celui actif au moment
    // de l'entrée en édition, pour repartir sur un état simple et prévisible.
    tabs.forEach(t=>t.classList.remove('active'));
    tabs[0].classList.add('active');
    fileModeEl.hidden = false; cameraModeEl.hidden = true;
  }
  document.getElementById('storyRestartBtn').addEventListener('click', exitEditMode);

  function resizeDrawCanvas(){
    const rect = editStage.getBoundingClientRect();
    drawCanvas.width = rect.width; drawCanvas.height = rect.height;
    redrawStrokes();
  }
  window.addEventListener('resize', resizeDrawCanvas);

  function redrawStrokes(){
    drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    for(const stroke of strokes){
      if(stroke.points.length < 2) continue;
      drawCtx.strokeStyle = stroke.color;
      drawCtx.lineWidth = stroke.size;
      drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round';
      drawCtx.beginPath();
      stroke.points.forEach((p,i)=>{
        const x = p.x*drawCanvas.width, y = p.y*drawCanvas.height;
        if(i===0) drawCtx.moveTo(x,y); else drawCtx.lineTo(x,y);
      });
      drawCtx.stroke();
    }
  }

  function relPoint(e){
    const rect = drawCanvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)/rect.width, y:(clientY-rect.top)/rect.height };
  }

  drawCanvas.addEventListener('pointerdown', (e)=>{
    if(activeTool !== 'draw') return;
    isDrawing = true;
    strokes.push({ color:activeColor, size:brushSize, points:[relPoint(e)] });
    drawCanvas.setPointerCapture(e.pointerId);
  });
  drawCanvas.addEventListener('pointermove', (e)=>{
    if(!isDrawing || activeTool !== 'draw') return;
    strokes[strokes.length-1].points.push(relPoint(e));
    redrawStrokes();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(evt=>{
    drawCanvas.addEventListener(evt, ()=>{ isDrawing = false; });
  });

  function setTool(tool){
    activeTool = activeTool === tool ? null : tool;
    document.getElementById('storyToolDraw').classList.toggle('active', activeTool==='draw');
    document.getElementById('storyToolText').classList.toggle('active', activeTool==='text');
    drawCanvas.style.pointerEvents = activeTool === 'draw' ? 'auto' : 'none';
    document.getElementById('storyColorRow').hidden = activeTool !== 'draw';
    document.getElementById('storyBrushSize').hidden = activeTool !== 'draw';
    if(activeTool === 'text'){
      addTextItem();
      activeTool = null; // le texte se place puis on repasse en mode neutre, pour ne pas ajouter un item par clic accidentel
      document.getElementById('storyToolText').classList.remove('active');
    }
  }
  document.getElementById('storyToolDraw').addEventListener('click', ()=>setTool('draw'));
  document.getElementById('storyToolText').addEventListener('click', ()=>setTool('text'));
  document.getElementById('storyToolUndo').addEventListener('click', ()=>{
    if(selectedTextId){
      textItems = textItems.filter(t=>t.id !== selectedTextId);
      selectedTextId = null;
      renderTextLayer();
      return;
    }
    strokes.pop();
    redrawStrokes();
  });

  const colorRow = document.getElementById('storyColorRow');
  colorRow.innerHTML = STORY_COLORS.map((c,i)=>`<button class="story-color-dot ${i===0?'active':''}" style="background:${c}" data-color="${c}" aria-label="Couleur ${c}"></button>`).join('');
  colorRow.querySelectorAll('.story-color-dot').forEach(dot=>{
    dot.addEventListener('click', ()=>{
      colorRow.querySelectorAll('.story-color-dot').forEach(d=>d.classList.remove('active'));
      dot.classList.add('active');
      activeColor = dot.dataset.color;
      if(selectedTextId){
        const item = textItems.find(t=>t.id===selectedTextId);
        if(item){ item.color = activeColor; renderTextLayer(); }
      }
    });
  });
  document.getElementById('storyBrushSize').addEventListener('input', (e)=>{ brushSize = Number(e.target.value); });

  function addTextItem(){
    const id = uid('txt');
    const item = { id, text:'Ton texte', x:0.5, y:0.45, color: activeColor };
    textItems.push(item);
    selectedTextId = id;
    renderTextLayer();
    requestAnimationFrame(()=>{
      const el = textLayer.querySelector(`[data-text-id="${id}"]`);
      if(el){ selectAllInEditableText(el); el.focus(); }
    });
  }

  function selectAllInEditableText(el){
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  }

  function renderTextLayer(){
    textLayer.innerHTML = textItems.map(item => `
      <div class="story-text-item ${item.id===selectedTextId?'selected':''}"
           data-text-id="${item.id}" contenteditable="true"
           style="left:${item.x*100}%; top:${item.y*100}%; color:${item.color}; transform:translate(-50%,-50%)">${escapeHTML(item.text)}</div>
    `).join('');
    textLayer.querySelectorAll('.story-text-item').forEach(el=>{
      bindTextItemDrag(el);
      el.addEventListener('input', ()=>{
        const item = textItems.find(t=>t.id===el.dataset.textId);
        if(item) item.text = el.textContent;
      });
      el.addEventListener('pointerdown', (e)=>{ e.stopPropagation(); selectedTextId = el.dataset.textId; textLayer.querySelectorAll('.story-text-item').forEach(o=>o.classList.toggle('selected', o===el)); });
    });
  }

  function bindTextItemDrag(el){
    let dragging = false, offsetX = 0, offsetY = 0;
    el.addEventListener('pointerdown', (e)=>{
      // Un simple tap doit pouvoir positionner le curseur pour éditer le texte ;
      // seul un déplacement réel (au-delà d'un petit seuil) déclenche le drag.
      dragging = false;
      const stageRect = editStage.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      offsetX = e.clientX - elRect.left - elRect.width/2;
      offsetY = e.clientY - elRect.top - elRect.height/2;
      const startX = e.clientX, startY = e.clientY;
      function onMove(ev){
        if(!dragging && (Math.abs(ev.clientX-startX) > 4 || Math.abs(ev.clientY-startY) > 4)){
          dragging = true;
          el.setPointerCapture(e.pointerId);
          window.getSelection()?.removeAllRanges(); // évite que le drag ne soit interprété comme une sélection de texte
        }
        if(!dragging) return;
        ev.preventDefault();
        const item = textItems.find(t=>t.id===el.dataset.textId);
        if(!item) return;
        const relX = (ev.clientX - stageRect.left - offsetX) / stageRect.width;
        const relY = (ev.clientY - stageRect.top - offsetY) / stageRect.height;
        item.x = Math.min(0.95, Math.max(0.05, relX));
        item.y = Math.min(0.95, Math.max(0.05, relY));
        el.style.left = item.x*100+'%';
        el.style.top = item.y*100+'%';
      }
      function onUp(ev){
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  }

  /* ---------- Partage : aplatit fond + dessin + texte en un seul dataURL ---------- */
  submitBtn.addEventListener('click', async ()=>{
    if(!baseImageDataUrl) return;
    submitBtn.disabled = true; submitBtn.textContent = 'Envoi…';
    clearError();
    try{
      const finalDataUrl = await flattenStoryCanvas();
      const caption = document.getElementById('storyCaption').value.trim();
      await createStory(finalDataUrl, caption);
      stopCamera();
      closeModal();
      toast('Story publiée pour 24 h.');
      if(State.route === '#feed') renderStoriesRow();
    }catch(err){
      showError(err.message || 'L\'envoi a échoué. Vérifie ta connexion et réessaie.');
      submitBtn.disabled = false; submitBtn.textContent = 'Partager';
    }
  });

  function flattenStoryCanvas(){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      img.onload = ()=>{
        const out = document.createElement('canvas');
        // On aplatit à la résolution réelle de l'image source (déjà compressée
        // en amont par compressImage ou la capture caméra) plutôt qu'à la taille
        // d'affichage du canvas d'édition, pour ne pas perdre en netteté.
        out.width = img.naturalWidth; out.height = img.naturalHeight;
        const octx = out.getContext('2d');
        octx.drawImage(img, 0, 0, out.width, out.height);
        for(const stroke of strokes){
          if(stroke.points.length < 2) continue;
          // Le ratio out.width/drawCanvas.width suppose que la taille du canvas
          // d'édition n'a pas changé depuis le dessin de ce trait. Cas limite
          // accepté : si la fenêtre est redimensionnée en cours d'édition, les
          // traits déjà tracés peuvent légèrement changer d'épaisseur relative
          // au partage. Négligeable en pratique, une story n'étant pas éditée
          // sur plusieurs minutes avec un redimensionnement de fenêtre au milieu.
          octx.strokeStyle = stroke.color;
          octx.lineWidth = stroke.size * (out.width/drawCanvas.width);
          octx.lineCap = 'round'; octx.lineJoin = 'round';
          octx.beginPath();
          stroke.points.forEach((p,i)=>{
            const x = p.x*out.width, y = p.y*out.height;
            if(i===0) octx.moveTo(x,y); else octx.lineTo(x,y);
          });
          octx.stroke();
        }
        for(const item of textItems){
          if(!item.text.trim()) continue;
          const fontSize = Math.round(out.width * 0.052);
          octx.font = `700 ${fontSize}px 'Inter Tight', sans-serif`;
          octx.fillStyle = item.color;
          octx.textAlign = 'center';
          octx.textBaseline = 'middle';
          octx.shadowColor = 'rgba(0,0,0,0.45)';
          octx.shadowBlur = fontSize*0.15;
          wrapCanvasText(octx, item.text, item.x*out.width, item.y*out.height, out.width*0.85, fontSize*1.2);
        }
        resolve(out.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = ()=>reject(new Error('Impossible de finaliser l\'image de la story.'));
      img.src = baseImageDataUrl;
    });
  }

  function wrapCanvasText(ctx, text, cx, cy, maxWidth, lineHeight){
    const words = text.split(/\s+/);
    const lines = [];
    let current = '';
    for(const word of words){
      const test = current ? current+' '+word : word;
      if(ctx.measureText(test).width > maxWidth && current){ lines.push(current); current = word; }
      else current = test;
    }
    if(current) lines.push(current);
    const startY = cy - ((lines.length-1)*lineHeight)/2;
    lines.forEach((line,i)=> ctx.fillText(line, cx, startY + i*lineHeight));
  }
}

let storyViewerState = null;
function openStoryViewer(entries, startIndex){
  storyViewerState = {entries, authorIdx: startIndex, storyIdx: 0, timer: null};
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="story-viewer-overlay" id="storyViewerOverlay"></div>`;
  requestAnimationFrame(()=>document.getElementById('storyViewerOverlay').classList.add('show'));
  renderStoryViewerFrame();
}

function renderStoryViewerFrame(){
  const {entries, authorIdx, storyIdx} = storyViewerState;
  const entry = entries[authorIdx];
  const story = entry.stories[storyIdx];
  const overlay = document.getElementById('storyViewerOverlay');
  if(!overlay) return;

  if(!story.viewedBy.includes(State.currentUser.id)){
    story.viewedBy.push(State.currentUser.id);
    DB.set('stories:'+story.id, story);
  }

  overlay.innerHTML = `
    <div class="story-viewer-box">
      <div class="story-progress-row">
        ${entry.stories.map((s,i)=>`<div class="story-progress-bar"><div class="story-progress-fill" style="width:${i<storyIdx?'100%':i===storyIdx?'0%':'0%'}" data-active="${i===storyIdx}"></div></div>`).join('')}
      </div>
      <div class="story-viewer-head">
        ${avatarHTML(entry.user, 34)}
        <b>${escapeHTML(entry.user.name)}</b>
        <span>${timeAgo(story.createdAt)}</span>
        <button class="icon-btn story-close-btn" id="closeStoryViewer" aria-label="Fermer">${iconX}</button>
      </div>
      <img src="${story.imageDataUrl}" class="story-viewer-img" alt="">
      ${story.text ? `<p class="story-viewer-caption">${escapeHTML(story.text)}</p>` : ''}
      <div class="story-nav-zone story-nav-prev" id="storyPrev"></div>
      <div class="story-nav-zone story-nav-next" id="storyNext"></div>
    </div>
  `;

  const fillBar = overlay.querySelector(`.story-progress-fill[data-active="true"]`);
  requestAnimationFrame(()=>{ if(fillBar){ fillBar.style.transition='width 5s linear'; fillBar.style.width='100%'; } });
  clearTimeout(storyViewerState.timer);
  storyViewerState.timer = setTimeout(()=>advanceStory(1), 5000);

  document.getElementById('closeStoryViewer').addEventListener('click', closeStoryViewer);
  document.getElementById('storyPrev').addEventListener('click', ()=>advanceStory(-1));
  document.getElementById('storyNext').addEventListener('click', ()=>advanceStory(1));
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeStoryViewer(); });
}

function advanceStory(dir){
  clearTimeout(storyViewerState.timer);
  const {entries} = storyViewerState;
  let {authorIdx, storyIdx} = storyViewerState;
  storyIdx += dir;
  if(storyIdx < 0){
    authorIdx -= 1;
    if(authorIdx < 0){ closeStoryViewer(); return; }
    storyIdx = entries[authorIdx].stories.length - 1;
  } else if(storyIdx >= entries[authorIdx].stories.length){
    authorIdx += 1;
    if(authorIdx >= entries.length){ closeStoryViewer(); return; }
    storyIdx = 0;
  }
  storyViewerState.authorIdx = authorIdx;
  storyViewerState.storyIdx = storyIdx;
  renderStoryViewerFrame();
}

function closeStoryViewer(){
  if(storyViewerState) clearTimeout(storyViewerState.timer);
  const overlay = document.getElementById('storyViewerOverlay');
  if(overlay){
    overlay.classList.remove('show');
    setTimeout(()=>{ const root = document.getElementById('modalRoot'); if(root) root.innerHTML=''; }, 200);
  }
  storyViewerState = null;
  if(State.currentUser && State.route === '#feed') renderStoriesRow();
}

async function toggleFollow(targetUser){
  const me = State.currentUser;
  const isFollowing = me.following.includes(targetUser.id);
  if(isFollowing){
    me.following = me.following.filter(id=>id!==targetUser.id);
    targetUser.followers = targetUser.followers.filter(id=>id!==me.id);
  } else {
    me.following.push(targetUser.id);
    targetUser.followers.push(me.id);
    await pushNotification(targetUser.id, 'follow', me.id, 'a commencé à te suivre');
  }
  await saveCurrentUser({following: me.following});
  await DB.set('users:'+targetUser.id, targetUser);
  State.users[targetUser.id] = targetUser;
  return !isFollowing;
}

/* ======================================================================
   MESSAGERIE
====================================================================== */
/** Reprend une conversation existante si elle existe, sinon en crée une —
 *  mais seulement si otherUserId autorise la personne courante à lui écrire.
 *  La restriction ne s'applique qu'à la CRÉATION : une conversation déjà
 *  entamée avant un changement de réglage n'est jamais coupée rétroactivement,
 *  par cohérence avec la façon dont isPrivate est présenté dans les paramètres. */
async function findOrCreateConversation(otherUserId){
  const myConvs = await DB.get('user:'+State.currentUser.id+':convs') || [];
  for(const cid of myConvs){
    const conv = await DB.get('conv:'+cid);
    // Ne réutilise que les DM à deux personnes : un groupe qui contiendrait
    // aussi otherUserId n'est jamais le bon résultat pour "écrire en privé à X".
    if(conv && !conv.isGroup && conv.members.includes(otherUserId)) return conv;
  }
  const other = await getUser(otherUserId);
  if(other?.messagePrivacy === 'followers' && !other.followers.includes(State.currentUser.id)){
    throw new DBError('FORBIDDEN', `${other.name} n'accepte les messages que de ses abonnés.`);
  }
  const id = uid('cv');
  const conv = {id, members:[State.currentUser.id, otherUserId], createdAt: Date.now(), isGroup:false, name:null};
  await DB.set('conv:'+id, conv);
  await DB.set('conv:'+id+':messages', []);
  const mine = await DB.get('user:'+State.currentUser.id+':convs') || [];
  mine.push(id); await DB.set('user:'+State.currentUser.id+':convs', mine);
  const theirs = await DB.get('user:'+otherUserId+':convs') || [];
  theirs.push(id); await DB.set('user:'+otherUserId+':convs', theirs);
  return conv;
}

/** Crée une conversation à plusieurs (3 personnes ou plus). Contrairement à
 *  findOrCreateConversation, ne cherche jamais un groupe existant avec les
 *  mêmes membres : créer un nouveau groupe avec les mêmes personnes est un
 *  choix délibéré et légitime (ex. un groupe par sujet), pas un doublon à
 *  fusionner. La confidentialité messagerie de CHAQUE membre est vérifiée
 *  individuellement, pas seulement celle de la personne qui initie. */
async function createGroupConversation(memberIds, groupName){
  const me = State.currentUser;
  const uniqueIds = [...new Set(memberIds)].filter(id => id !== me.id);
  if(uniqueIds.length < 2){
    throw new DBError('INVALID', 'Un groupe nécessite au moins 2 autres personnes.');
  }
  const members = await Promise.all(uniqueIds.map(id=>getUser(id)));
  for(const member of members){
    if(member?.messagePrivacy === 'followers' && !member.followers.includes(me.id)){
      throw new DBError('FORBIDDEN', `${member.name} n'accepte les messages que de ses abonnés, et ne peut pas être ajouté(e) au groupe.`);
    }
  }
  const id = uid('cv');
  const allMemberIds = [me.id, ...uniqueIds];
  const conv = {
    id, members: allMemberIds, createdAt: Date.now(),
    isGroup: true, name: (groupName||'').trim() || null,
  };
  await DB.set('conv:'+id, conv);
  await DB.set('conv:'+id+':messages', []);
  for(const memberId of allMemberIds){
    const theirs = await DB.get('user:'+memberId+':convs') || [];
    theirs.push(id);
    await DB.set('user:'+memberId+':convs', theirs);
  }
  return conv;
}

/** Nom d'affichage d'une conversation, groupe ou DM. Pour un groupe sans nom
 *  personnalisé, compose les prénoms des autres membres façon "Alice, Bob et
 *  2 autres" plutôt que de laisser un intitulé vide. */
/** Signal de frappe éphémère, stocké par personne (pas juste par conversation)
 *  pour savoir précisément QUI écrit dans un groupe. Pas de vrai événement
 *  "a arrêté d'écrire" : on stocke juste un timestamp, et paintTypingIndicator
 *  le considère expiré après quelques secondes sans nouveau signal — plus
 *  simple et plus robuste qu'un événement explicite qui pourrait ne jamais
 *  arriver si l'onglet se ferme brutalement pendant que la personne tapait. */
function typingKey(convId, userId){ return `typing:${convId}:${userId}`; }
async function signalTyping(convId){
  await DB.set(typingKey(convId, State.currentUser.id), Date.now(), true).catch(()=>{});
}
async function clearTypingSignal(convId){
  await DB.del(typingKey(convId, State.currentUser.id), true).catch(()=>{});
}
const TYPING_SIGNAL_TTL_MS = 4000;
async function paintTypingIndicator(convId, conv, otherMembers){
  const el = document.getElementById('typingIndicator');
  if(!el) return;
  const now = Date.now();
  const typingNow = [];
  for(const member of otherMembers){
    const ts = await DB.get(typingKey(convId, member.id), true).catch(()=>null);
    if(typeof ts === 'number' && (now - ts) < TYPING_SIGNAL_TTL_MS) typingNow.push(member);
  }
  if(!document.getElementById('typingIndicator')) return; // route quittée pendant la lecture
  if(typingNow.length === 0){
    el.hidden = true;
    return;
  }
  el.hidden = false;
  if(!conv.isGroup){
    el.textContent = 'est en train d\'écrire…';
  } else if(typingNow.length === 1){
    el.textContent = `${typingNow[0].name.split(' ')[0]} est en train d'écrire…`;
  } else {
    el.textContent = `${typingNow.length} personnes sont en train d'écrire…`;
  }
}

function conversationDisplayName(conv, otherMembers){
  if(conv.isGroup){
    if(conv.name) return conv.name;
    const names = otherMembers.map(u=>u?.name?.split(' ')[0] || 'Utilisateur');
    if(names.length <= 3) return names.join(', ');
    return `${names.slice(0,2).join(', ')} et ${names.length-2} autres`;
  }
  return otherMembers[0]?.name || 'Utilisateur';
}

/** Relit l'utilisateur depuis le stockage (pas la copie en mémoire, qui peut
 *  dater d'avant l'ouverture du fil) pour afficher un statut de présence à
 *  jour. Appelée au rendu initial du fil, puis à chaque cycle de polling —
 *  voir isRecentlyActive pour la définition honnête d'"en ligne" utilisée.
 *  Lit DB.get directement plutôt que getUser() : getUser met en cache et ne
 *  propose aucun moyen de forcer un rafraîchissement, ce qui figerait le
 *  statut de présence sur sa toute première valeur lue. */
async function paintPresence(otherUser){
  const el = document.getElementById('threadPresence');
  if(!el || !otherUser) return;
  const fresh = await DB.get('users:'+otherUser.id);
  if(!document.getElementById('threadPresence')) return; // route quittée pendant la lecture
  if(isRecentlyActive(fresh?.lastActiveAt)){
    el.textContent = 'En ligne';
    el.classList.add('is-online');
  } else {
    el.textContent = fresh?.lastActiveAt ? `Vu ${timeAgo(fresh.lastActiveAt)}` : '';
    el.classList.remove('is-online');
  }
}

/** Envoie un message chiffré bout en bout. Le texte en clair n'est JAMAIS
 *  écrit dans le stockage : seul { iv, ciphertext, keys } l'est. Si le
 *  chiffrement n'est pas disponible (navigateur sans Web Crypto, ou l'un
 *  des deux comptes n'a pas de clé publique — cas hérité), le message est
 *  envoyé en clair et marqué explicitement `encrypted:false`, affiché comme
 *  tel dans l'interface plutôt que de faussement prétendre être protégé. */
/** Envoie un message chiffré bout en bout, à un DM ou un groupe indifféremment.
 *  Le texte en clair n'est JAMAIS écrit dans le stockage : seul
 *  { iv, ciphertext, keys } l'est. keys contient une entrée par membre du
 *  groupe (voir encryptForRecipients, conçue nativement pour N destinataires
 *  via une enveloppe RSA par personne autour d'une même clé AES) — un groupe
 *  de 8 personnes n'est pas différent d'un DM pour le chiffrement lui-même,
 *  seulement pour le nombre d'entrées dans `keys`. Si le chiffrement n'est
 *  pas disponible (navigateur sans Web Crypto, ou un membre sans clé
 *  publique — cas hérité), le message est envoyé en clair et marqué
 *  explicitement `encrypted:false`, affiché comme tel plutôt que de
 *  faussement prétendre être protégé. */
/** Envoie un message chiffré bout en bout, à un DM ou un groupe indifféremment.
 *  Accepte soit une chaîne de texte simple (rétrocompatible avec tous les
 *  appels existants), soit un objet {text, imageDataUrl} pour joindre une
 *  photo. Dans les deux cas, on chiffre un unique JSON stringifié — le
 *  chiffrement AES-GCM n'a pas de limite de taille pratique pour un artifact
 *  (contrairement à RSA, mais RSA ne chiffre ici que la clé AES de 32
 *  octets, jamais le contenu lui-même : voir encryptForRecipients), donc
 *  une image compressée en dataURL de plusieurs centaines de Ko passe sans
 *  souci. Le texte en clair n'est JAMAIS écrit dans le stockage : seul
 *  { iv, ciphertext, keys } l'est. Si le chiffrement n'est pas disponible
 *  (navigateur sans Web Crypto, ou un membre sans clé publique), le message
 *  est envoyé en clair et marqué explicitement `encrypted:false`. */
async function sendMessage(convId, content){
  const payload = typeof content === 'string' ? {text: content, imageDataUrl: null} : content;
  const conv = await DB.get('conv:'+convId);
  if(!conv) throw new DBError('NOT_FOUND', 'Conversation introuvable.');
  const me = State.currentUser;
  const otherIds = conv.members.filter(m=>m!==me.id);
  const others = (await Promise.all(otherIds.map(id=>getUser(id)))).filter(Boolean);

  const myPriv = E2E_SUPPORTED ? getLocalPrivateKey(me.id) : null;
  const allHaveKeys = others.every(u=>!!u.publicKey);
  const canEncrypt = E2E_SUPPORTED && !!me.publicKey && allHaveKeys && !!myPriv;

  const serialized = JSON.stringify(payload);
  let msg;
  if(canEncrypt){
    const recipients = [
      {userId: me.id, publicJwk: me.publicKey},
      ...others.map(u=>({userId: u.id, publicJwk: u.publicKey})),
    ];
    const enc = await CryptoE2E.encryptForRecipients(serialized, recipients);
    msg = { id: uid('m'), senderId: me.id, createdAt: Date.now(), encrypted:true, iv:enc.iv, ciphertext:enc.ciphertext, keys:enc.keys };
  } else {
    msg = { id: uid('m'), senderId: me.id, createdAt: Date.now(), encrypted:false, text: serialized };
  }

  const messages = await DB.get('conv:'+convId+':messages') || [];
  messages.push(msg);
  await DB.set('conv:'+convId+':messages', messages);
  const notifSuffix = payload.imageDataUrl && !payload.text ? 't\'a envoyé une photo' : 't\'a envoyé un message';
  const notifBody = conv.isGroup ? `${notifSuffix} dans ${conversationDisplayName(conv, others)}` : notifSuffix;
  await Promise.all(otherIds.map(id => pushNotification(id, 'message', me.id, notifBody).catch(()=>{})));
  return msg;
}

/** Déchiffre un message pour l'affichage. Renvoie { text, imageDataUrl,
 *  encrypted, error? }. Le contenu déchiffré (ou en clair) est désormais un
 *  JSON stringifié {text, imageDataUrl} — voir sendMessage. Pour les
 *  messages envoyés AVANT ce changement, le contenu est du texte brut, pas
 *  du JSON : parsePayload retombe silencieusement sur {text: brut} si
 *  JSON.parse échoue, pour ne jamais casser l'affichage des anciennes
 *  conversations après cette mise à jour. */
function parseMessagePayload(raw){
  try{
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object' && ('text' in parsed || 'imageDataUrl' in parsed)) return parsed;
    return {text: raw, imageDataUrl: null};
  }catch(e){
    return {text: raw, imageDataUrl: null}; // ancien format pré-photos : texte brut tel quel
  }
}
async function decryptMessageForDisplay(msg){
  if(!msg.encrypted){
    const payload = parseMessagePayload(msg.text);
    return { text: payload.text, imageDataUrl: payload.imageDataUrl || null, encrypted:false };
  }
  try{
    const raw = await CryptoE2E.decryptForMe(msg, State.currentUser.id);
    const payload = parseMessagePayload(raw);
    return { text: payload.text, imageDataUrl: payload.imageDataUrl || null, encrypted:true };
  }catch(err){
    return { text: null, imageDataUrl: null, encrypted:true, error: err.message };
  }
}

async function renderMessagesPage(){
  stopPolling();
  const myGen = appGeneration;
  const main = document.getElementById('mainCol');
  if(!main) return;
  const myConvIds = await DB.get('user:'+State.currentUser.id+':convs') || [];
  if(myGen !== appGeneration || !document.getElementById('mainCol')) return;

  main.innerHTML = `
    <div class="messages-shell">
      <div class="conv-list-col">
        <div class="feed-header">
          <h1>Messages</h1>
          <button class="icon-btn" id="newGroupBtn" aria-label="Nouveau groupe" title="Nouveau groupe" style="margin-left:auto">${iconUsers}</button>
        </div>
        <div class="conv-list" id="convList">
          ${myConvIds.length===0 ? '' : '<div class="skeleton-post" style="height:64px"></div>'}
        </div>
      </div>
      <div class="thread-col" id="threadCol"></div>
    </div>
  `;
  document.getElementById('newGroupBtn').addEventListener('click', openNewGroupModal);

  const convListEl = document.getElementById('convList');
  if(myConvIds.length === 0){
    convListEl.innerHTML = emptyStateHTML('messages', 'Aucune conversation', 'Va sur le profil de quelqu\'un et lance une conversation pour la voir apparaître ici.', null, null);
    renderEmptyThread();
    return;
  }

  const convs = (await Promise.all(myConvIds.map(id=>DB.get('conv:'+id)))).filter(Boolean);
  const entries = [];
  for(const conv of convs){
    const otherIds = conv.members.filter(m=>m!==State.currentUser.id);
    const otherMembers = (await Promise.all(otherIds.map(id=>getUser(id)))).filter(Boolean);
    const messages = await DB.get('conv:'+conv.id+':messages') || [];
    const last = messages[messages.length-1];
    let preview = 'Dites bonjour 👋';
    if(last){
      const decrypted = await decryptMessageForDisplay(last);
      let text;
      if(decrypted.error) text = 'Message illisible sur cet appareil';
      else if(decrypted.imageDataUrl) text = decrypted.text ? `📷 ${decrypted.text}`.slice(0,38) : '📷 Photo';
      else text = (decrypted.text || '').slice(0,38);
      // Dans un groupe, on précise qui a écrit le dernier message (sauf si c'est nous) : sinon "Dites bonjour" perd tout son sens à plusieurs.
      if(conv.isGroup && !decrypted.error){
        const sender = last.senderId === State.currentUser.id ? 'Toi' : (await getUser(last.senderId))?.name?.split(' ')[0] || '';
        preview = sender ? `${sender} : ${text}` : text;
      } else {
        preview = text;
      }
    }
    const isEncrypted = E2E_SUPPORTED && !!State.currentUser.publicKey && otherMembers.every(u=>!!u.publicKey) && otherMembers.length>0;
    entries.push({conv, otherMembers, last, preview, isEncrypted});
  }
  if(myGen !== appGeneration || !document.getElementById('convList')) return;
  entries.sort((a,b)=>(b.last?.createdAt||b.conv.createdAt) - (a.last?.createdAt||a.conv.createdAt));

  convListEl.innerHTML = entries.map(e => `
    <button class="conv-list-item" data-conv="${e.conv.id}">
      ${e.conv.isGroup ? groupAvatarHTML(e.otherMembers, 46) : avatarHTML(e.otherMembers[0], 46)}
      <div class="conv-list-text">
        <b>${escapeHTML(conversationDisplayName(e.conv, e.otherMembers))} ${e.isEncrypted ? `<span class="conv-lock-mini" title="Chiffré">${iconLock}</span>` : ''}</b>
        <span>${escapeHTML(e.preview)}</span>
      </div>
      ${e.last ? `<span class="conv-list-time">${timeAgo(e.last.createdAt)}</span>` : ''}
    </button>
  `).join('');

  convListEl.querySelectorAll('.conv-list-item').forEach(btn=>{
    btn.addEventListener('click', ()=>openThread(btn.dataset.conv));
  });

  if(State.activeConversationId && entries.find(e=>e.conv.id===State.activeConversationId)){
    openThread(State.activeConversationId);
  } else if(entries.length){
    openThread(entries[0].conv.id);
  } else {
    renderEmptyThread();
  }
}

/** Avatar de groupe : deux avatars des premiers membres, chevauchés en
 *  diagonale — un motif visuel immédiatement reconnaissable comme "plusieurs
 *  personnes", distinct d'un avatar simple, sans avoir besoin d'une image
 *  de groupe uploadée que Nova ne propose pas. */
function groupAvatarHTML(members, size=46){
  const shown = members.slice(0,2);
  if(shown.length === 0) return `<div class="avatar-wrap" style="--size:${size}px"><div class="avatar" style="width:${size}px;height:${size}px;background:var(--border-strong)"></div></div>`;
  const smallSize = Math.round(size*0.62);
  return `
  <div class="group-avatar-stack" style="width:${size}px;height:${size}px">
    ${shown.map((u,i)=>`
      <div class="avatar" style="width:${smallSize}px;height:${smallSize}px;background:${u.avatarColor};font-size:${Math.max(9,smallSize*0.38)}px;position:absolute;${i===0?`top:0;left:0`:`bottom:0;right:0`};border:2px solid var(--surface)">
        ${initials(u.name)}
      </div>`).join('')}
  </div>`;
}

/** N'est appelée aujourd'hui que juste après une fraîche injection de
 *  .messages-shell (jamais après un openThread() dans le même cycle), donc
 *  la classe thread-active-mobile n'a jamais besoin d'être retirée ici. Si
 *  une future fonctionnalité de suppression de conversation permet un jour
 *  de revenir à cet état vide APRÈS avoir eu un fil ouvert, il faudra alors
 *  retirer explicitement cette classe ici pour ne pas rester bloqué sur un
 *  fil vide invisible côté mobile. */
function renderEmptyThread(){
  const col = document.getElementById('threadCol');
  if(col) col.innerHTML = `<div class="thread-empty">${emptyStateHTML('messages','Sélectionne une conversation','Choisis une discussion dans la liste pour l\'ouvrir.', null, null)}</div>`;
}

/** Modale de création de groupe. La liste de personnes sélectionnables vient
 *  des abonnements de l'utilisateur courant, pas d'une recherche libre dans
 *  toute la base : ajouter quelqu'un à un groupe est un acte social qui a
 *  plus de sens entre personnes qui se suivent déjà, et ça évite d'exposer
 *  l'annuaire complet des comptes comme surface de sélection. */
async function openNewGroupModal(){
  const me = State.currentUser;
  const candidates = (await Promise.all(me.following.map(id=>getUser(id)))).filter(Boolean);
  const selected = new Set();

  openModal(`
    <div class="modal-header">
      <h3>Nouveau groupe</h3>
      <button class="icon-btn" id="closeNewGroup" aria-label="Fermer">${iconX}</button>
    </div>
    <div class="composer-body">
      <input type="text" id="groupNameInput" class="story-caption-input" style="position:static;background:var(--bg);color:var(--ink);border:1.5px solid var(--border);margin-bottom:16px" placeholder="Nom du groupe (facultatif)" maxlength="60">
      ${candidates.length === 0
        ? `<p style="font-size:13.5px;color:var(--ink-faint);text-align:center;padding:20px 0">Tu dois suivre au moins 2 personnes pour créer un groupe.</p>`
        : `<p style="font-size:13px;color:var(--ink-faint);margin-bottom:10px">Choisis au moins 2 personnes parmi tes abonnements</p>
           <div class="group-member-picker" id="groupMemberPicker">
             ${candidates.map(u=>`
               <label class="group-member-row" data-uid="${u.id}">
                 <input type="checkbox" class="group-member-checkbox" value="${u.id}">
                 ${avatarHTML(u, 38)}
                 <div class="conv-list-text"><b>${escapeHTML(u.name)}</b><span>@${escapeHTML(u.handle)}</span></div>
               </label>
             `).join('')}
           </div>`
      }
      <p class="composer-error" id="groupError" hidden></p>
    </div>
    <div class="modal-footer">
      <span id="groupSelectedCount" style="font-size:12.5px;color:var(--ink-faint)">0 sélectionné(e)</span>
      <button class="btn-accent" id="createGroupBtn" style="margin-left:auto" ${candidates.length===0?'disabled':''}>Créer le groupe</button>
    </div>
  `);
  document.getElementById('closeNewGroup').addEventListener('click', closeModal);

  const countLabel = document.getElementById('groupSelectedCount');
  const createBtn = document.getElementById('createGroupBtn');
  const errorEl = document.getElementById('groupError');

  document.querySelectorAll('.group-member-row').forEach(row=>{
    const checkbox = row.querySelector('.group-member-checkbox');
    row.addEventListener('click', (e)=>{
      if(e.target !== checkbox) checkbox.checked = !checkbox.checked;
      const uid = row.dataset.uid;
      if(checkbox.checked) selected.add(uid); else selected.delete(uid);
      row.classList.toggle('selected', checkbox.checked);
      countLabel.textContent = `${selected.size} sélectionné(e)${selected.size>1?'s':''}`;
    });
  });

  createBtn?.addEventListener('click', async ()=>{
    errorEl.hidden = true;
    if(selected.size < 2){
      errorEl.textContent = 'Sélectionne au moins 2 personnes.';
      errorEl.hidden = false;
      return;
    }
    createBtn.disabled = true; createBtn.textContent = 'Création…';
    try{
      const name = document.getElementById('groupNameInput').value;
      const conv = await createGroupConversation([...selected], name);
      closeModal();
      toast('Groupe créé.');
      State.activeConversationId = conv.id;
      if(State.route === '#messages') renderMessagesPage(); else location.hash = '#messages';
    }catch(err){
      errorEl.textContent = err.message || 'Impossible de créer le groupe.';
      errorEl.hidden = false;
      createBtn.disabled = false; createBtn.textContent = 'Créer le groupe';
    }
  });
}

/** Modale d'information de groupe : liste des participants. En lecture

 *  gérer dynamiquement la liste soulèverait des questions de permissions
 *  (qui peut ajouter/exclure qui) qui dépassent le cadre de cette fonctionnalité. */

      <div class="group-member-picker">
        <div class="group-member-row" style="cursor:default">
          ${avatarHTML(State.currentUser, 38)}

async function openThread(convId){
  State.activeConversationId = convId;
  document.querySelector('.messages-shell')?.classList.add('thread-active-mobile');
  document.querySelectorAll('.conv-list-item').forEach(el=>el.classList.toggle('active', el.dataset.conv===convId));
  const conv = await DB.get('conv:'+convId);
  const otherIds = conv.members.filter(m=>m!==State.currentUser.id);
  const otherMembers = (await Promise.all(otherIds.map(id=>getUser(id)))).filter(Boolean);
  const memberById = new Map([State.currentUser, ...otherMembers].filter(Boolean).map(u=>[u.id, u]));
  const isEncrypted = E2E_SUPPORTED && !!State.currentUser.publicKey && otherMembers.length>0 && otherMembers.every(u=>!!u.publicKey);
  const displayName = conversationDisplayName(conv, otherMembers);
  const col = document.getElementById('threadCol');
  col.innerHTML = `
    <div class="thread-head">
      <button class="icon-btn thread-back-btn" id="threadBackBtn" aria-label="Retour aux conversations">${iconArrowLeft}</button>
      ${conv.isGroup ? groupAvatarHTML(otherMembers, 38) : avatarHTML(otherMembers[0], 38)}
      <div class="thread-head-text">
        <b>${escapeHTML(displayName)}</b>
        ${conv.isGroup
          ? `<span class="thread-head-sub">${otherMembers.length+1} participants</span>`
          : `<span class="thread-head-sub" id="threadPresence"></span>`}
      </div>
      ${conv.isGroup ? `<button class="icon-btn" id="groupInfoBtn" aria-label="Infos du groupe" style="margin-left:auto">${iconUsers}</button>` : ''}
      <span class="thread-encryption-badge ${isEncrypted?'is-on':'is-off'}" title="${isEncrypted ? 'Chiffré de bout en bout' : 'Non chiffré'}" style="${conv.isGroup?'margin-left:8px':''}">
        ${isEncrypted ? iconLock : iconLockOpen}
        <span>${isEncrypted ? 'Chiffré' : 'Non chiffré'}</span>
      </span>
    </div>
    <div class="thread-messages" id="threadMessages"></div>
    <p class="typing-indicator" id="typingIndicator" hidden></p>
    <p class="composer-error" id="threadError" hidden></p>
    <div class="thread-photo-preview" id="threadPhotoPreview" hidden></div>
    <form class="thread-composer" id="threadComposer">
      <button type="button" class="icon-btn" id="threadPhotoBtn" aria-label="Joindre une photo">${iconImage}</button>
      <input type="file" id="threadPhotoInput" accept="image/*" hidden>
      <input type="text" id="threadInput" placeholder="Écrire un message…" maxlength="500" autocomplete="off">
      <button type="submit" class="icon-btn" aria-label="Envoyer">${iconSend}</button>
    </form>
  `;
  if(!conv.isGroup) paintPresence(otherMembers[0]);
  paintTypingIndicator(convId, conv, otherMembers);
  await paintThreadMessages(convId, conv, memberById, displayName);

  // Délégation d'événement unique sur le conteneur, branchée une seule fois
  // à l'ouverture du fil : paintThreadMessages régénère le innerHTML des
  // bulles à chaque cycle de polling (toutes les 3s), donc attacher un
  // écouteur PAR image à chaque re-rendu accumulerait des doublons sans
  // jamais les nettoyer. Le conteneur box, lui, n'est jamais recréé.
  document.getElementById('threadMessages')?.addEventListener('click', (e)=>{
    const img = e.target.closest('[data-open-photo]');
    if(img) openPhotoViewerModal(img.src);
  });

  document.getElementById('groupInfoBtn')?.addEventListener('click', ()=>openGroupInfoModal(conv, otherMembers));
  document.getElementById('threadBackBtn').addEventListener('click', ()=>{
    document.querySelector('.messages-shell')?.classList.remove('thread-active-mobile');
  });

  let pendingPhotoDataUrl = null;

  const photoBtn = document.getElementById('threadPhotoBtn');
  const photoInput = document.getElementById('threadPhotoInput');
  const photoPreview = document.getElementById('threadPhotoPreview');
  photoBtn.addEventListener('click', ()=>photoInput.click());
  photoInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const errorEl = document.getElementById('threadError');
    const submitBtn = document.querySelector('#threadComposer button[type="submit"]');
    errorEl.hidden = true;
    if(!file.type.startsWith('image/')){ errorEl.textContent = 'Ce fichier n\'est pas une image.'; errorEl.hidden = false; return; }
    photoPreview.hidden = false;
    photoPreview.innerHTML = `<div class="composer-spinner"></div>`;
    // Le bouton d'envoi est désactivé pendant la compression : sans ça, une
    // personne qui appuie sur Entrée juste après avoir choisi une photo (avant
    // que compressImage() ait fini, ce qui peut prendre plusieurs centaines
    // de ms pour une grosse image) enverrait son message SANS la photo, qui
    // resterait alors compressée dans l'aperçu sans jamais être envoyée.
    if(submitBtn) submitBtn.disabled = true;
    try{
      // Compression comme pour les posts et stories : une photo prise avec un
      // téléphone récent peut faire 4-8 Mo, bien trop lourd pour ce que le
      // stockage de l'artifact doit absorber à chaque message envoyé.
      pendingPhotoDataUrl = await compressImage(file, {maxDim:1400, quality:0.8});
      photoPreview.innerHTML = `
        <img src="${pendingPhotoDataUrl}" alt="Aperçu">
        <button type="button" class="icon-btn" id="cancelPhotoBtn" aria-label="Retirer la photo">${iconX}</button>
      `;
      document.getElementById('cancelPhotoBtn').addEventListener('click', ()=>{
        pendingPhotoDataUrl = null;
        photoPreview.hidden = true;
        photoPreview.innerHTML = '';
        photoInput.value = '';
      });
    }catch(err){
      pendingPhotoDataUrl = null;
      photoPreview.hidden = true;
      errorEl.textContent = 'Impossible de traiter cette image : ' + err.message;
      errorEl.hidden = false;
    }finally{
      if(submitBtn) submitBtn.disabled = false;
    }
  });

  document.getElementById('threadComposer').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const input = document.getElementById('threadInput');
    const errorEl = document.getElementById('threadError');
    const text = input.value.trim();
    if(!text && !pendingPhotoDataUrl) return; // rien à envoyer : ni texte, ni photo
    const savedText = text;
    const savedPhoto = pendingPhotoDataUrl;
    input.value = '';
    pendingPhotoDataUrl = null;
    photoPreview.hidden = true;
    photoPreview.innerHTML = '';
    photoInput.value = '';
    errorEl.hidden = true;
    clearTypingSignal(convId); // on vient d'envoyer : plus la peine d'afficher "en train d'écrire" aux autres
    try{
      await sendMessage(convId, {text: savedText, imageDataUrl: savedPhoto});
      await paintThreadMessages(convId, conv, memberById, displayName);
    }catch(err){
      input.value = savedText; // on ne perd jamais ce que la personne a écrit
      pendingPhotoDataUrl = savedPhoto; // ni la photo déjà compressée
      if(savedPhoto){
        photoPreview.hidden = false;
        photoPreview.innerHTML = `<img src="${savedPhoto}" alt="Aperçu"><button type="button" class="icon-btn" id="cancelPhotoBtn" aria-label="Retirer la photo">${iconX}</button>`;
        document.getElementById('cancelPhotoBtn').addEventListener('click', ()=>{ pendingPhotoDataUrl = null; photoPreview.hidden = true; photoPreview.innerHTML = ''; });
      }
      errorEl.textContent = err.message || 'Échec de l\'envoi. Vérifie ta connexion et réessaie.';
      errorEl.hidden = false;
    }
  });

  // Signal de frappe éphémère, throttlé pour ne pas écrire dans le stockage
  // partagé à chaque caractère tapé — un signal toutes les ~2s suffit, les
  // autres participants ne relisent de toute façon qu'au rythme du polling.
  let lastTypingSignalAt = 0;
  document.getElementById('threadInput').addEventListener('input', (e)=>{
    if(!e.target.value.trim()){ clearTypingSignal(convId); return; }
    const now = Date.now();
    if(now - lastTypingSignalAt < 2000) return;
    lastTypingSignalAt = now;
    signalTyping(convId);
  });

  stopPolling();
  State.pollTimer = setInterval(async ()=>{
    if(State.route !== '#messages' || State.activeConversationId !== convId) return;
    await paintThreadMessages(convId, conv, memberById, displayName, true);
    if(!conv.isGroup) await paintPresence(otherMembers[0]);
    await paintTypingIndicator(convId, conv, otherMembers);
  }, 3000);
}

let lastPaintedCount = 0;
async function paintThreadMessages(convId, conv, memberById, displayName, isPoll=false){
  const messages = await DB.get('conv:'+convId+':messages') || [];
  if(isPoll && messages.length === lastPaintedCount) return;
  lastPaintedCount = messages.length;
  const box = document.getElementById('threadMessages');
  if(!box) return;
  const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;

  if(messages.length === 0){
    box.innerHTML = `<p class="no-comments" style="text-align:center;padding:30px 0">Dites bonjour à ${escapeHTML(displayName)} 👋</p>`;
    return;
  }

  const rows = [];
  let prevSenderId = null;
  for(const m of messages){
    const mine = m.senderId === State.currentUser.id;
    const decrypted = await decryptMessageForDisplay(m);
    let bodyHTML;
    if(decrypted.error){
      bodyHTML = `<span class="msg-undecryptable">${iconLockOpen} Message illisible sur cet appareil</span>`;
    } else {
      const imageHTML = decrypted.imageDataUrl ? `<img src="${decrypted.imageDataUrl}" alt="Photo" class="msg-photo" data-open-photo>` : '';
      const textHTML = decrypted.text ? `<span class="msg-text">${richTextHTML(decrypted.text)}</span>` : '';
      bodyHTML = imageHTML + textHTML;
    }
    // Le nom d'expéditeur n'apparaît que dans un groupe, jamais dans nos
    // propres messages, et seulement au-dessus du premier d'une série
    // consécutive du même expéditeur — pas sur chaque bulle, ce qui serait
    // répétitif dès qu'une personne enchaîne plusieurs messages.
    const showSenderLabel = conv.isGroup && !mine && m.senderId !== prevSenderId;
    const senderLabel = showSenderLabel ? `<span class="msg-sender-label">${escapeHTML(memberById.get(m.senderId)?.name || 'Utilisateur')}</span>` : '';
    prevSenderId = m.senderId;
    rows.push(`<div class="msg-row ${mine?'mine':''}">
      ${senderLabel}
      <div class="msg-bubble">${bodyHTML}</div>
    </div>`);
  }
  if(!document.getElementById('threadMessages')) return; // route quittée pendant le déchiffrement
  box.innerHTML = rows.join('');
  if(wasNearBottom || !isPoll) box.scrollTop = box.scrollHeight;
}

/** Page Rechercher : contrairement à avant, affiche TOUT LE MONDE par défaut
 *  (un vrai annuaire), pas seulement un champ vide en attente de saisie. La
 *  recherche filtre cette liste en direct plutôt que de partir de rien —
 *  sinon il n'existe aucun moyen de simplement parcourir qui est inscrit
 *  sur l'instance sans déjà connaître un nom à taper. */
async function renderSearchPage(){
  const myGen = appGeneration;
  const main = document.getElementById('mainCol');
  if(!main) return;
  main.innerHTML = `
    <div class="feed-header"><h1>Rechercher</h1></div>
    <div class="search-bar">
      ${iconSearch}
      <input type="text" id="searchInput" placeholder="Rechercher un compte ou un #hashtag…" autocomplete="off">
    </div>
    <div class="search-tabs" id="searchTabs">
      <button class="search-tab active" data-tab="everyone">Tout le monde</button>
      <button class="search-tab" data-tab="following">Abonnements</button>
    </div>
    <div id="searchResults" class="search-results">
      <div class="skeleton-post" style="height:64px"></div>
      <div class="skeleton-post" style="height:64px"></div>
      <div class="skeleton-post" style="height:64px"></div>
    </div>
  `;
  const input = document.getElementById('searchInput');
  const results = document.getElementById('searchResults');

  const idx = await DB.get('handles:index', true) || {};
  if(myGen !== appGeneration || !document.getElementById('searchResults')) return;
  const allIds = Object.values(idx).filter(id => id !== State.currentUser.id);
  const allUsers = (await Promise.all(allIds.map(id=>getUser(id)))).filter(Boolean);
  if(myGen !== appGeneration || !document.getElementById('searchResults')) return;
  // Tri par activité récente d'abord (voir isRecentlyActive du système de
  // présence), puis par ordre alphabétique : un annuaire où les comptes
  // actifs remontent est plus utile qu'un tri purement alphabétique figé.
  allUsers.sort((a,b)=>{
    const aActive = isRecentlyActive(a.lastActiveAt) ? 1 : 0;
    const bActive = isRecentlyActive(b.lastActiveAt) ? 1 : 0;
    if(aActive !== bActive) return bActive - aActive;
    return a.name.localeCompare(b.name);
  });

  let activeTab = 'everyone';

  function renderUserList(users){
    if(users.length === 0){
      results.innerHTML = `<p class="no-comments" style="padding:20px 4px">Aucun résultat.</p>`;
      return;
    }
    results.innerHTML = users.map(u => `
      <a href="#profile/${u.id}" class="search-result-item">
        ${avatarHTML(u, 48)}
        <div class="conv-list-text">
          ${nameWithBadgeHTML(u)}
          <span>@${escapeHTML(u.handle)} ${isRecentlyActive(u.lastActiveAt) ? '<span class="search-online-dot" title="En ligne"></span>' : ''}</span>
        </div>
      </a>
    `).join('');
  }

  function currentBaseList(){
    return activeTab === 'following'
      ? allUsers.filter(u => State.currentUser.following.includes(u.id))
      : allUsers;
  }

  async function doSearch(q){
    q = q.trim().toLowerCase();
    const base = currentBaseList();

    if(q.startsWith('#')){
      const tag = q.slice(1);
      if(!tag){ renderUserList(base); return; }
      results.innerHTML = `
        <a href="#hashtag/${encodeURIComponent(tag)}" class="search-result-item">
          <div class="hashtag-result-icon">${iconHashtag}</div>
          <div class="conv-list-text">
            <b>#${escapeHTML(tag)}</b>
            <span>Voir les publications</span>
          </div>
        </a>`;
      return;
    }

    if(!q){ renderUserList(base); return; }
    const matches = base.filter(u => u.name.toLowerCase().includes(q) || u.handle.includes(q));
    renderUserList(matches);
  }

  renderUserList(currentBaseList());

  document.getElementById('searchTabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('.search-tab');
    if(!btn) return;
    document.querySelectorAll('.search-tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    doSearch(input.value);
  });

  let debounceTimer;
  input.addEventListener('input', ()=>{
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(()=>doSearch(input.value), 180);
  });
}
