<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue — Bazar Al Madina</title>
<meta name="description" content="Tous les articles du Bazar Al Madina : recherchez, filtrez par catégorie et triez par prix.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="zone-header"></div>

<div class="bandeau-page motif-zellige">
  <h1>Catalogue</h1>
  <p>Tous nos articles, à parcourir et filtrer selon vos envies.</p>
</div>

<!-- ============================================================
     ZONE RECHERCHE + FILTRES
     ============================================================ -->
<div class="zone-controles" style="margin-top: 24px;">
  <div class="carte-controles">
    <div class="ligne-recherche">
      <div class="champ-recherche">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="champ-recherche-nom" placeholder="Rechercher un article… (ex : théière, veste, jouet)" aria-label="Rechercher un produit par nom">
      </div>
    </div>
    <div class="ligne-filtres">
      <div class="groupe-select">
        <label for="select-categorie">Catégorie</label>
        <select id="select-categorie" aria-label="Filtrer par catégorie"></select>
      </div>
      <div class="groupe-select">
        <label for="select-etat">État</label>
        <select id="select-etat" aria-label="Filtrer par état">
          <option value="tous">Tous les états</option>
          <option value="Neuf">Neuf</option>
          <option value="Très bon">Très bon</option>
          <option value="Bon">Bon</option>
          <option value="Occasion">Occasion</option>
        </select>
      </div>
      <div class="groupe-select">
        <label for="select-tri">Trier par</label>
        <select id="select-tri" aria-label="Trier les produits">
          <option value="defaut">Pertinence</option>
          <option value="prix-asc">Prix croissant</option>
          <option value="prix-desc">Prix décroissant</option>
          <option value="note-desc">Mieux notés</option>
        </select>
      </div>
      <span class="puce-resultats" id="puce-resultats"></span>
    </div>
  </div>
</div>

<nav class="rangee-chips" id="rangee-chips" aria-label="Raccourcis de catégories"></nav>

<main class="contenu">
  <h2 class="titre-section" id="titre-resultats">Tous nos articles</h2>
  <div class="grille-produits apparition-liste" id="grille-produits"></div>
</main>

<div id="zone-footer"></div>
<div id="zone-panier-coulissant"></div>

<div class="superposition" id="superposition-detail" role="dialog" aria-modal="true" aria-labelledby="titre-modale-detail">
  <div class="modale-detail" id="modale-detail"></div>
</div>

<script src="donnees.js"></script>
<script src="commun.js"></script>
<script>
/* ============================================================================
   catalogue.html — logique spécifique : recherche, filtres, tri, aperçu
   ============================================================================ */

let filtreRecherche = "";
let filtreCategorie = "toutes";
let filtreEtat = "tous";
let filtreTri = "defaut";

// Lecture des paramètres d'URL (ex : catalogue.html?categorie=Jouets)
function lireParametresUrl() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("categorie")) filtreCategorie = params.get("categorie");
  if (params.get("recherche")) filtreRecherche = params.get("recherche");
}

function obtenirProduitsFiltres() {
  let resultat = PRODUCTS.slice();

  if (filtreRecherche.trim() !== "") {
    const recherche = filtreRecherche.trim().toLowerCase();
    resultat = resultat.filter(p => p.titre.toLowerCase().includes(recherche) || p.description.toLowerCase().includes(recherche));
  }
  if (filtreCategorie !== "toutes") {
    resultat = resultat.filter(p => p.categorie === filtreCategorie);
  }
  if (filtreEtat !== "tous") {
    resultat = resultat.filter(p => p.etat === filtreEtat);
  }

  if (filtreTri === "prix-asc") resultat.sort((a, b) => a.prix - b.prix);
  else if (filtreTri === "prix-desc") resultat.sort((a, b) => b.prix - a.prix);
  else if (filtreTri === "note-desc") resultat.sort((a, b) => (noteMoyenne(b.id) || 0) - (noteMoyenne(a.id) || 0));

  return resultat;
}

function construireCarteProduitHtml(produit) {
  const note = noteMoyenne(produit.id);
  const estFav = estFavori(produit.id);
  const enComparaison = estEnComparaison(produit.id);

  let badges = `<span class="etiquette-etat ${classeEtat(produit.etat)}">${echapperHtml(produit.etat)}</span>`;
  if (produit.nouveau) badges += `<span class="etiquette-badge nouveau">Nouveau</span>`;
  if (produit.prixAvant) badges += `<span class="etiquette-badge promo">Promo</span>`;

  return `
    <div class="carte-produit">
      <a href="produit.html?id=${produit.id}" class="lien-carte-produit" data-action-apercu="${produit.id}">
        <div class="vignette-produit">
          <img src="${produit.image}" alt="${echapperHtml(produit.titre)}" loading="lazy">
          <div class="etiquettes-badges">${badges}</div>
        </div>
      </a>
      <button class="bouton-favori-carte ${estFav ? "actif" : ""}" data-favori-id="${produit.id}" aria-label="Ajouter aux favoris" aria-pressed="${estFav}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="${estFav ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </button>
      <div class="infos-produit">
        <a href="produit.html?id=${produit.id}" class="lien-carte-produit">
          <span class="categorie-produit">${echapperHtml(produit.categorie)}</span>
          <h3 class="titre-produit">${echapperHtml(produit.titre)}</h3>
          ${note ? `<div class="ligne-note-mini">${construireEtoilesHtml(note, 12)}<span>${note}</span></div>` : `<p class="description-produit">${echapperHtml(produit.description)}</p>`}
        </a>
        <div class="bas-carte">
          <div class="bloc-prix-carte">
            ${produit.prixAvant ? `<span class="prix-avant-carte">${formaterPrix(produit.prixAvant)} MAD</span>` : ""}
            <span class="prix-produit">${formaterPrix(produit.prix)}<span> MAD</span></span>
          </div>
          <div class="actions-carte">
            <button class="bouton-comparer-carte ${enComparaison ? "actif" : ""}" data-comparer-id="${produit.id}" aria-label="Ajouter au comparateur" aria-pressed="${enComparaison}">⚖</button>
            <button class="bouton-ajouter" data-ajouter-id="${produit.id}" aria-label="Ajouter ${echapperHtml(produit.titre)} au panier">+</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function rafraichirGrilleProduits() {
  const grille = document.getElementById("grille-produits");
  const puceResultats = document.getElementById("puce-resultats");
  const titreResultats = document.getElementById("titre-resultats");
  const produits = obtenirProduitsFiltres();

  if (produits.length === 0) {
    grille.innerHTML = `
      <div class="aucun-resultat">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <strong>Aucun article trouvé</strong>
        Essayez une autre recherche ou une autre catégorie.
      </div>
    `;
  } else {
    grille.innerHTML = produits.map(construireCarteProduitHtml).join("");
    attacherEcouteursGrille(grille);
  }

  puceResultats.textContent = produits.length + (produits.length > 1 ? " articles" : " article");
  titreResultats.textContent = filtreCategorie === "toutes" ? "Tous nos articles" : filtreCategorie;
}

function attacherEcouteursGrille(grille) {
  grille.querySelectorAll("[data-favori-id]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.preventDefault(); basculerFavori(btn.dataset.favoriId); });
  });
  grille.querySelectorAll("[data-comparer-id]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.preventDefault(); basculerComparaison(btn.dataset.comparerId); });
  });
  grille.querySelectorAll("[data-ajouter-id]").forEach(btn => {
    btn.addEventListener("click", (e) => { e.preventDefault(); ajouterAuPanier(Number(btn.dataset.ajouterId)); });
  });
}

function initialiserSelectCategorie() {
  const select = document.getElementById("select-categorie");
  let html = '<option value="toutes">Toutes les catégories</option>';
  CATEGORIES.forEach(cat => { html += `<option value="${echapperHtml(cat.nom)}">${cat.icone} ${echapperHtml(cat.nom)}</option>`; });
  select.innerHTML = html;
  select.value = filtreCategorie;
}

function initialiserChipsCategories() {
  const rangee = document.getElementById("rangee-chips");
  let html = `<button class="chip ${filtreCategorie === "toutes" ? "actif" : ""}" data-categorie="toutes">Toutes</button>`;
  CATEGORIES.forEach(cat => {
    html += `<button class="chip ${filtreCategorie === cat.nom ? "actif" : ""}" data-categorie="${echapperHtml(cat.nom)}">${cat.icone} ${echapperHtml(cat.nom)}</button>`;
  });
  rangee.innerHTML = html;

  rangee.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      filtreCategorie = chip.dataset.categorie;
      document.getElementById("select-categorie").value = filtreCategorie;
      rangee.querySelectorAll(".chip").forEach(c => c.classList.remove("actif"));
      chip.classList.add("actif");
      rafraichirGrilleProduits();
    });
  });
}

function ouvrirDetailProduit(idProduit) {
  const produit = trouverProduitParId(idProduit);
  if (!produit) return;

  const modale = document.getElementById("modale-detail");
  const estFav = estFavori(produit.id);
  modale.innerHTML = `
    <div class="entete-modale">
      <button class="bouton-fermer" id="bouton-fermer-detail" aria-label="Fermer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <img class="image-modale" src="${produit.image}" alt="${echapperHtml(produit.titre)}">
    <div class="corps-modale">
      <span class="categorie-produit">${echapperHtml(produit.categorie)}</span>
      <h2 id="titre-modale-detail">${echapperHtml(produit.titre)}</h2>
      <div class="meta-modale">
        <span class="etiquette-etat ${classeEtat(produit.etat)}" style="position:static;">${echapperHtml(produit.etat)}</span>
      </div>
      <p class="description-longue">${echapperHtml(produit.descriptionLongue || produit.description)}</p>
      <div class="barre-prix-modale">
        <span class="prix-modale">${formaterPrix(produit.prix)} MAD</span>
        <div style="display:flex; gap:8px;">
          <a href="produit.html?id=${produit.id}" class="bouton-secondaire-page" aria-label="Voir la fiche complète">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </a>
          <button class="bouton-ajouter-modale" id="bouton-ajouter-depuis-modale" data-id-produit="${produit.id}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            Ajouter au panier
          </button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("bouton-fermer-detail").addEventListener("click", fermerDetailProduit);
  document.getElementById("bouton-ajouter-depuis-modale").addEventListener("click", () => {
    ajouterAuPanier(produit.id);
    fermerDetailProduit();
  });

  document.getElementById("superposition-detail").classList.add("visible");
  document.body.style.overflow = "hidden";
}

function fermerDetailProduit() {
  document.getElementById("superposition-detail").classList.remove("visible");
  document.body.style.overflow = "";
}

document.addEventListener("DOMContentLoaded", () => {
  initialiserCommun();
  lireParametresUrl();

  document.getElementById("champ-recherche-nom").value = filtreRecherche;
  initialiserSelectCategorie();
  initialiserChipsCategories();
  rafraichirGrilleProduits();

  document.getElementById("champ-recherche-nom").addEventListener("input", (e) => {
    filtreRecherche = e.target.value;
    rafraichirGrilleProduits();
  });

  document.getElementById("select-categorie").addEventListener("change", (e) => {
    filtreCategorie = e.target.value;
    document.querySelectorAll(".chip").forEach(c => c.classList.toggle("actif", c.dataset.categorie === filtreCategorie));
    rafraichirGrilleProduits();
  });

  document.getElementById("select-etat").addEventListener("change", (e) => {
    filtreEtat = e.target.value;
    rafraichirGrilleProduits();
  });

  document.getElementById("select-tri").addEventListener("change", (e) => {
    filtreTri = e.target.value;
    rafraichirGrilleProduits();
  });

  document.getElementById("superposition-detail").addEventListener("click", (e) => {
    if (e.target.id === "superposition-detail") fermerDetailProduit();
  });
});
</script>
</body>
</html>
